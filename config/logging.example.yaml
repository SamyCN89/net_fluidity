version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/net_fluidity.log
    maxBytes: 1048576
    backupCount: 3
loggers:
  shared_code:
    level: INFO
    handlers: [console]
    propagate: false
  net_fluidity_julien:
    level: INFO
    handlers: [console]
    propagate: false
  allegiance:
    level: INFO
    handlers: [console]
    propagate: false
  julien_data:
    level: INFO
    handlers: [console]
    propagate: false
  scripts:
    level: INFO
    handlers: [console]
    propagate: false
root:
  level: WARNING
  handlers: [console]
